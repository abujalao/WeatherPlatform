<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/src/favicon.png">
</head>
<body>
    <div id="weather-overlay"></div>
    <nav class="navigation">
        <div class="nav-left">
            <img src="src/Cloud.png" class="img-cloud">
            <p class="left-title">Weatherly</p>
        </div>
        <div class="nav-center">
            <button class="button-unit-toggle" id="unit-toggle">
                <span class="unit-option">&#176;C</span>
                <span class="unit-option">&#176;F</span>
            </button>
        </div>
        <div class="nav-right">

            <div class="section-search">
                <div class="input-frame">
                    <input class="input-search" placeholder="City name">
                    <button class="button-reset-search">X</button>
                </div>
                
                <div class="result-frame">
                    <div class="search-history-frame">
                    </div>
                    <div class="search-results-frame">
                    </div>
                    
                </div>
                
            </div>
            
            <button class="button-search">
                <img src="src/MagnifyGlass.png" class="img-search">
            </button>
        </div>
    </nav>
    <section class="section-main">
        <div class="main-info">
            <h1 class="city-name">---</h1>
            <h2 class="temp"><span class="data-temp">-</span>&#176;</h2>
        </div>
        <div class="main-desc">
            <h3 class="weather-desc">---</h3>
            <div class="temp-center-frame">
                <p class="temp-center">H: <span class="temp-high">-</span>&#176;</p>
                <p class="temp-center">L: <span class="temp-low">-</span>&#176;</p>
            </div> 
            
        </div>
        <div class="main-icon-frame">
            <img class="weather-state-icon" src="src/static/default.svg">
        </div>
        
    </section>

    <section class="section-forecast">
        <div class="forecast-frame">

        </div>
    </section>

    <section class="section-stats">
        <div class="stats-frame">
            <div>
                <p class="stat-text">Weather Condition</p>
            </div>
            <div class="data-row-grid">

                <div class="data-item">
                    <img class="data-img" src="src/wind.png" > 
                    <div class="data-text-group">
                        <p class="data-name">Wind Speed</p>
                        <p class="data-value"><span class="data-value-wind">-</span> <span class="speed-unit">m/s</span></p>
                    </div>
                </div>

                <div class="data-item">
                    <img class="data-img" src="src/humidity.png"> 
                    <div class="data-text-group">
                        <p class="data-name">Humidity</p>
                        <p class="data-value"><span class="data-value-humidity">-</span> %</p>
                    </div>
                </div>

                <div class="data-item">
                    <img class="data-img" src="src/visibility.png"> 
                    <div class="data-text-group">
                        <p class="data-name">Visibility</p>
                        <p class="data-value"><span class="data-value-visibility">-</span> <span class="distance-unit">km</span></p>
                    </div>
                </div>

                <div class="data-item">
                    <img class="data-img" src="src/pressure.png"> 
                    <div class="data-text-group">
                        <p class="data-name">Pressure</p>
                        <p class="data-value"><span class="data-value-pressure">-</span> hPa</p>
                    </div>
                </div>

            </div>
        </div>
    </section>


    <script src="config.js"></script>
    <script type="module" src="Modules/api.js"></script>
    <script type="module" src="Modules/storage.js"></script>
    <script type="module" src="Modules/ui.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
