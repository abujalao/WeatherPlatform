<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navigation">
        <div class="nav-left">
            <img src="src/Cloud.png" class="img-cloud">
            <p class="left-title">Weatherly</p>
        </div>
        <div class="nav-center">
            <button class="button-unit-toggle" id="unit-toggle">
                <span class="unit-option active">&#176;C</span>
                <span class="unit-option">&#176;F</span>
            </button>
        </div>
        <div class="nav-right">

            <div class="section-search">
                <input class="input-search" placeholder="City name">
                <div class="result-frame">
                    <!-- <button class="button-result">Dubai, UAE</button> -->
                </div>
                
            </div>
            
            <button class="button-search">
                <img src="src/MagnifyGlass.png" class="img-search">
            </button>
        </div>
    </nav>
    <section class="section-main">
        <div class="main-info">
            <h1 class="city-name">City</h1>
            <h2 class="temp"><span class="data-temp">0</span>&#176;</h2>
        </div>
        <div>
            <img class="weather-state-icon" src="src/sunny.png">
        </div>
        
    </section>

    <section class="section-forecast">
        <div class="forecast-frame">
            
            <!--<div class="forecast-item">
                <p class="forecast-time">6:00 PM</p>
                <img class="forecast-icon" src="src/sunny.png">
                <p class="forecast-temp"><span class="forecast-value">19</span>&#176;</p>
            </div>-->

        </div>
    </section>

    <section class="section-stats">
        <div class="stats-frame">
            <div>
                <p class="stat-text">Weather Condition</p>
                <br />
            </div>
            <div class="data-row-grid">

                <div class="data-item">
                    <img class="data-img" src="src/wind.png" > 
                    <div class="data-text-group">
                        <p class="data-name">Wind Speed</p>
                        <p class="data-value"><span class="data-value-wind">0</span> <span class="speed-unit">km/h</span></p>
                    </div>
                </div>

                <div class="data-item">
                    <img class="data-img" src="src/humidity.png"> 
                    <div class="data-text-group">
                        <p class="data-name">Humidity</p>
                        <p class="data-value"><span class="data-value-humidity">0</span> %</p>
                    </div>
                </div>

                <div class="data-item">
                    <img class="data-img" src="src/visibility.png"> 
                    <div class="data-text-group">
                        <p class="data-name">Visibility</p>
                        <p class="data-value"><span class="data-value-visibility">0</span> <span class="distance-unit">km</span></p>
                    </div>
                </div>

                <div class="data-item">
                    <img class="data-img" src="src/pressure.png"> 
                    <div class="data-text-group">
                        <p class="data-name">Pressure</p>
                        <p class="data-value"><span class="data-value-pressure">0</span> hPa</p>
                    </div>
                </div>

            </div>
        </div>
    </section>


    <script src="config.js"></script>
    <script type="module" src="Modules/api.js"></script>
    <script type="module" src="Modules/ui.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
