<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navigation">
        <div class="nav-left">
            <img src="src/Cloud.png" class="img-cloud">
            <!--<p class="center-text">Weatherly</p>-->
        </div>
        <div class="nav-center">
            <button class="button-unit-toggle" id="unit-toggle">
                <span class="unit-option active">&#176;C</span>
                <span class="unit-option">&#176;F</span>
            </button>
        </div>
        <div class="nav-right">
            <input class="input-search">
            <button class="button-search">
                <img src="src/MagnifyGlass.png" class="img-search">
            </button>
        </div>
    </nav>
    <section class="section-main">
        <div class="main-info">
            <h1 class="city-name">Dubai</h1>
            <h2 class="temp">16&#176;</h2>
        </div>
        <div>
            <img class="weather-state-icon" src="src/sunny.png">
        </div>
        
    </section>

    <section class="section-forecast">
        <div class="forecast-frame">
            <div class="forecast-item">
                <p class="forecast-time">6:00 PM</p>
                <img class="forecast-icon" src="src/sunny.png">
                <p class="forecast-temp">19&#176;</p>
            </div>
        </div>
    </section>

    <section class="section-stats">

    </section>
</body>
</html>
